name: TikTok Autoposter Tests

on:
  pull_request:
    paths:
      - "automation/tiktok-autoposter/**"
      - ".github/workflows/tiktok-autoposter-tests.yml"
  push:
    branches:
      - "feat/tiktok-autoposter"
    paths:
      - "automation/tiktok-autoposter/**"
      - ".github/workflows/tiktok-autoposter-tests.yml"

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m py_compile automation/tiktok-autoposter/autoposter.py automation/tiktok-autoposter/import_cookies.py automation/tiktok-autoposter/patch_upstream.py
      - run: python -m pytest -q automation/tiktok-autoposter/tests/test_policy.py
