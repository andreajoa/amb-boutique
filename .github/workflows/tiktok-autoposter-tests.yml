name: TikTok Autoposter Tests

on:
  pull_request:
    paths:
      - "automation/tiktok-autoposter/**"
      - ".github/workflows/tiktok-autoposter-tests.yml"
  push:
    branches:
      - "feat/tiktok-autoposter"
      - "feat/tiktok-first-live-launcher"
      - "feat/tiktok-real-auto-queue"
    paths:
      - "automation/tiktok-autoposter/**"
      - ".github/workflows/tiktok-autoposter-tests.yml"

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m py_compile automation/tiktok-autoposter/autoposter.py automation/tiktok-autoposter/import_cookies.py automation/tiktok-autoposter/patch_upstream.py automation/tiktok-autoposter/auto_queue.py automation/tiktok-autoposter/auto_runner.py
      - run: python -m pytest -q automation/tiktok-autoposter/tests
        env:
          PYTHONPATH: automation/tiktok-autoposter
      - run: bash -n automation/tiktok-autoposter/setup.sh automation/tiktok-autoposter/install_macos_scheduler.sh automation/tiktok-autoposter/uninstall_macos_scheduler.sh automation/tiktok-autoposter/FIRST_TIKTOK_LIVE_TEST.command automation/tiktok-autoposter/ENABLE_REAL_TIKTOK_AUTOMATION.command

  upstream-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned TikTok uploader and apply compatibility patch
        run: bash automation/tiktok-autoposter/setup.sh
      - name: Verify patched uploader
        run: |
          test -f automation/tiktok-autoposter/vendor/TiktokAutoUploader/cli.py
          test -x automation/tiktok-autoposter/.venv/bin/python
          grep -q 'Load the complete TikTok-only cookie subset' automation/tiktok-autoposter/vendor/TiktokAutoUploader/tiktok_uploader/tiktok.py
          grep -q 'Browser exports may contain multiple msToken cookies' automation/tiktok-autoposter/vendor/TiktokAutoUploader/tiktok_uploader/tiktok.py
          grep -q '"visibility_type": visibility_type' automation/tiktok-autoposter/vendor/TiktokAutoUploader/tiktok_uploader/tiktok.py
